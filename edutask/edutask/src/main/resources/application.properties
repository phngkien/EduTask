spring.application.name=edutask

# ===================================================================
# DATABASE CONNECTION (MICROSOFT SQL SERVER)
# ===================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=edutask_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================================================================
# JPA & HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===================================================================
# JWT CONFIGURATION
# ===================================================================
app.jwt.secret=eduTask2026SecureSecretKeyMustBeAtLeast256BitsLongForHmacSha256SecurityPurposes
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000

# ===================================================================
# SERVER
# ===================================================================
server.port=8080

# ===================================================================
# SPRINGDOC / SWAGGER UI
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===================================================================
# LOGGING
# ===================================================================
logging.level.com.edutask=INFO
logging.level.org.springframework.security=WARN

spring.application.name=edutask

# ===================================================================
# DATABASE CONNECTION (MICROSOFT SQL SERVER)
# ===================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=edutask_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================================================================
# JPA & HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===================================================================
# JWT CONFIGURATION
# ===================================================================
app.jwt.secret=eduTask2026SecureSecretKeyMustBeAtLeast256BitsLongForHmacSha256SecurityPurposes
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000

# ===================================================================
# SERVER
# ===================================================================
server.port=8080

# ===================================================================
# SPRINGDOC / SWAGGER UI
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===================================================================
# LOGGING
# ===================================================================
logging.level.com.edutask=INFO
logging.level.org.springframework.security=WARN

# ===================================================================
# CASSO WEBHOOK CONFIGURATION
# ===================================================================
app.casso.secure-token=EduTaskSecureToken123456

# ===================================================================
# HIGH-CONCURRENCY PERFORMANCE TUNING (200+ USERS)
# ===================================================================
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=20
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.leak-detection-threshold=2000

# ===================================================================
# HIBERNATE & CACHING CONFIGURATION
# ===================================================================
spring.jpa.open-in-view=false
spring.cache.type=simple

# ===================================================================
# EMAIL SMTP CONFIGURATION (GMAIL)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=phamnguyenkien1609@gmail.com
spring.mail.password=mezzqhabclnsqzjy
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================================================================
# GEMINI AI CONFIGURATION
# ===================================================================
app.gemini.api-key= ${GCP_API_KEY}
